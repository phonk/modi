<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="La stessa scala, vista da un’altra nota: i sette modi, la scala maggiore da cui vengono e il cerchio delle quinte.">
<meta name="theme-color" content="#02040F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="modi">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>modi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400&display=swap">
<style>
/* Layout: one column; the dial is the picture, the rest is text you tap */
:root{
  --bg:#02040F; --ink:#E5DADA; --mute:#968E96; --line:#152139; --amber:#E59500; --wine:#D2577F;
  --font:"Helvetica Neue","IBM Plex Sans",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:1px solid var(--amber);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-weight:300;font-size:1.5rem;margin:0}
.tag{margin:2px 0 0;color:var(--mute);font-size:.92rem}
.lang{display:flex;gap:10px;font-size:.95rem}
.lang button{color:var(--mute)}
.lang button[aria-pressed="true"]{color:var(--amber)}
section{display:flex;flex-direction:column;gap:12px}
h2{font-weight:400;font-size:.95rem;color:var(--mute);margin:0}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px}
.opts button{font-size:1.05rem;opacity:.55;padding:4px 0;position:relative}
.opts button[aria-pressed="true"]{opacity:1;color:var(--amber)}
.opts button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--amber)}
.modes button{text-transform:lowercase}
.dial{width:100%;max-width:320px;aspect-ratio:1;margin:0 auto;display:block}
.dial text{font-family:var(--font)}
.view{justify-content:center;margin-bottom:6px}
.view button{font-size:.95rem}
.center{text-align:center;margin:4px auto 0}
.sig{color:var(--mute);font-size:.95rem;margin:-14px 0 0}
.big{font-weight:300;font-size:1.55rem;line-height:1.25;margin:0;text-wrap:balance}
.big b{font-weight:300;color:var(--wine)}
.big i{font-style:normal;color:var(--amber)}
.deg{display:flex;flex-wrap:wrap;gap:4px 14px}
.deg button{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;padding:4px 6px;margin:0 -6px;border-radius:6px;transition:background .5s}
.deg button.ring{background:color-mix(in srgb, var(--amber) 22%, transparent);transition:none}
.deg .d{font-size:1.05rem}
.deg .n{font-size:.78rem;color:var(--mute)}
.deg .tonic .d{color:var(--amber)}
.deg .key .d{color:var(--wine)}
.hint{font-size:.88rem;color:var(--mute);margin:0;max-width:56ch}
.same{display:flex;flex-wrap:wrap;gap:4px 14px}
.same button{color:var(--mute);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.ladder{display:flex;flex-direction:column;gap:2px}
.ladder button{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:baseline;text-align:left;padding:5px 0;border-top:1px solid var(--line)}
.ladder .nm{text-transform:lowercase}
.ladder .ns{font-size:.85rem;color:var(--mute);letter-spacing:.02em;min-width:0}
.ladder .ns em{font-style:normal;color:var(--wine)}
.ladder button[aria-pressed="true"] .nm{color:var(--amber)}
.ladder button[aria-pressed="true"] .ns{color:var(--ink)}
.row{display:flex;gap:18px;font-size:.95rem}
.row button{display:inline-flex;align-items:center;gap:10px;padding:10px 18px 10px 14px;border-radius:999px;border:1px solid var(--amber);color:var(--amber);font-size:1rem}
.row button::before{content:"";width:10px;height:12px;background:currentColor;clip-path:polygon(0 0,100% 50%,0 100%)}
.row button:active{background:var(--amber);color:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div><h1>modi</h1><p class="tag" data-t="tag"></p></div>
    <div class="lang" id="lang"><button data-l="it">it</button><button data-l="en">en</button></div>
  </header>

  <section>
    <h2 data-t="tonic"></h2>
    <div class="opts" id="keys"></div>
  </section>

  <section>
    <h2 data-t="mode"></h2>
    <div class="opts modes" id="modes"></div>
  </section>

  <div>
    <div class="opts view" id="view"></div>
    <svg class="dial" id="dial" viewBox="0 0 300 300" role="img"></svg>
    <p class="hint center" id="viewHint"></p>
  </div>

  <p class="big" id="big"></p>
  <p class="sig" id="sig"></p>

  <section>
    <div class="deg" id="deg"></div>
    <p class="hint" id="info"></p>
    <div class="row"><button id="playScale" data-t="play"></button></div>
  </section>

  <section>
    <h2 data-t="same"></h2>
    <div class="same" id="same"></div>
  </section>

  <section>
    <h2 data-t="ladder"></h2>
    <div class="ladder" id="ladder"></div>
    <p class="hint" data-t="ladderHint"></p>
  </section>
</div>


<footer class="phonk-foot"><a href="https://github.com/phonk/modi" data-t="source"></a><span aria-hidden="true">·</span><a href="https://phonk.github.io/">phonk</a></footer>
<style>.phonk-foot{display:flex;justify-content:center;gap:10px;padding:32px 16px 12px;font-size:.8rem;letter-spacing:.04em;color:var(--mute,var(--ink-dim,var(--muted,#968E96)))}.phonk-foot a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px}.phonk-foot a:hover,.phonk-foot a:focus-visible{color:var(--amber,#E59500);border-bottom-color:currentColor;outline:none}</style>
<script>
(()=>{
const NT=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const IT={C:"Do",D:"Re",E:"Mi",F:"Fa",G:"Sol",A:"La",B:"Si"};
const TX={
  it:{source:"codice su github",tag:"la stessa scala, vista da un’altra nota",views:["semitoni","quinte","quarte"],viewHint:["","Nel cerchio delle quinte le note di un modo sono sempre sette punti vicini. I modi sono in ordine dal più luminoso al più scuro: ogni tocco sposta lo spicchio di un passo.","Il cerchio delle quarte è quello delle quinte percorso al contrario: lo stesso arco, girato dall’altra parte."],
    sig:n=>n===0?"armatura di chiave: nessuna alterazione":`armatura di chiave: ${Math.abs(n)} ${n>0?(Math.abs(n)===1?"diesis":"diesis"):(Math.abs(n)===1?"bemolle":"bemolli")}`,
    tonic:"tonica",mode:"modo",play:"suona la scala",same:"stesse note, altre toniche",ladder:"dal più luminoso al più scuro, sulla stessa tonica",
    ladderHint:"A ogni passo verso il basso una nota scende di un semitono, segnata in rosso.",dial:"Il modo su un cerchio di dodici note",
    major:"maggiore",itself:(t,r)=>`<i>${t}</i> è proprio <b>${r}</b>.`,uses:(t,r,o)=>`<i>${t}</i> usa le note di <b>${r}</b>, partendo dal suo ${o} grado.`,
    ord:["1°","2°","3°","4°","5°","6°","7°"],colour:d=>`La nota in rosso, ${d}, è quella che dà il colore al modo. Tocca una nota per sentirla.`,
    names:["ionico","dorico","frigio","lidio","misolidio","eolio","locrio"],
    info:["La scala maggiore. Luminosa e stabile; la 7ª tende verso la tonica.","Minore con la 6ª maggiore. Fresco e aperto, il minore del jazz e del folk.",
      "Minore con la 2ª bemolle, un semitono sopra la tonica. Scuro, spagnolo, mediorientale.","Maggiore con la 4ª eccedente. Sospeso e luminoso.",
      "Maggiore con la 7ª bemolle. Blues, rock, folk.","Il minore naturale. La 6ª bemolle gli dà la sua tristezza.",
      "2ª e 5ª bemolle: niente quinta giusta, quindi non si posa mai del tutto."]},
  en:{source:"source on github",tag:"the same scale, seen from another note",views:["semitones","fifths","fourths"],viewHint:["","On the circle of fifths a mode’s notes are always seven neighbouring points. The modes are listed from brightest to darkest: each tap moves the arc one step.","The circle of fourths is the circle of fifths walked the other way: the same arc, turning the other direction."],
    sig:n=>n===0?"key signature: no sharps or flats":`key signature: ${Math.abs(n)} ${n>0?(Math.abs(n)===1?"sharp":"sharps"):(Math.abs(n)===1?"flat":"flats")}`,
    tonic:"tonic",mode:"mode",play:"play the scale",same:"same notes, other tonics",ladder:"from brightest to darkest, on the same tonic",
    ladderHint:"Each step down lowers one note by a semitone, shown in red.",dial:"The mode on a twelve-note circle",
    major:"major",itself:(t,r)=>`<i>${t}</i> is <b>${r}</b> itself.`,uses:(t,r,o)=>`<i>${t}</i> uses the notes of <b>${r}</b>, starting from its ${o} degree.`,
    ord:["1st","2nd","3rd","4th","5th","6th","7th"],colour:d=>`The note in red, ${d}, is the one that gives the mode its colour. Tap a note to hear it.`,
    names:["ionian","dorian","phrygian","lydian","mixolydian","aeolian","locrian"],
    info:["The major scale. Bright and settled; the 7th leans up into the tonic.","Minor with a major 6th. Cool and open, the jazz and folk minor.",
      "Minor with a flat 2nd, one semitone above the tonic. Dark, Spanish, Middle Eastern.","Major with a sharp 4th. Floating and luminous.",
      "Major with a flat 7th. Bluesy, rock, folk.","The natural minor. The flat 6th gives it its sadness.",
      "Flat 2nd and flat 5th: no perfect fifth, so it never quite settles."]}
};
const M=[
  {o:0,s:[0,2,4,5,7,9,11],k:11},{o:2,s:[0,2,3,5,7,9,10],k:9},{o:4,s:[0,1,3,5,7,8,10],k:1},{o:5,s:[0,2,4,6,7,9,11],k:6},
  {o:7,s:[0,2,4,5,7,9,10],k:10},{o:9,s:[0,2,3,5,7,8,10],k:8},{o:11,s:[0,1,3,5,6,8,10],k:6}
];
// spell a seven-note scale with one letter per degree, so E lydian reads G♯ A♯ D♯, not A♭ B♭ E♭
const LET="CDEFGAB",NAT=[0,2,4,5,7,9,11];
const ENH={1:["C♯","D♭"],3:["D♯","E♭"],6:["F♯","G♭"],8:["G♯","A♭"],10:["A♯","B♭"]};
function spellFrom(name,key,sc){const tl=LET.indexOf(name[0]);return sc.map((x,i)=>{const L=(tl+i)%7,d=((key+x-NAT[L])%12+18)%12-6;
  return LET[L]+(d===2?"𝄪":d===-2?"𝄫":d>0?"♯":d<0?"♭":"")})}
// for black-key tonics, use whichever spelling needs fewer accidentals (D♯ locrian rather than E♭ with a B𝄫)
function spell(key,sc){const c=(ENH[key]||[NT[key]]).map(n=>spellFrom(n,key,sc));
  const cost=a=>a.join("").replace(/[𝄪𝄫]/g,"xx").replace(/[^♯♭x]/g,"").length;return c.reduce((a,b)=>cost(b)<cost(a)?b:a)}
const BRIGHT=[3,0,4,1,5,2,6]; // lydian → locrian
const DEG=(x,sc)=>x===6&&!sc.includes(7)?"♭5":["1","♭2","2","♭3","3","4","♯4","5","♭6","6","♭7","7"][x];
const S={key:4,mode:2,lang:"it",view:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("modes")||"{}"))}catch(e){}
const $=id=>document.getElementById(id);
const T=()=>TX[S.lang]||TX.it;
const N=n=>S.lang==="it"?IT[n[0]]+n.slice(1):n; // note name in the current language

function opts(el,items,lab,set){el.innerHTML="";items.forEach((it,i)=>{const b=document.createElement("button");b.textContent=lab(it,i);b.onclick=()=>{set(i);render()};el.appendChild(b)})}

function dial(m,root,SP,name){
  const cx=150,cy=150,R=104,rx=(root-S.key+12)%12;
  const STEP=[1,7,5][S.view||0],pi=x=>(x*STEP)%12;
  const P=(x,r)=>{const a=-Math.PI/2+pi(x)/12*Math.PI*2;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  const f=v=>v.toFixed(1);
  let g=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  let ord=[...m.s].sort((a,b)=>pi(a)-pi(b));
  // start after the widest empty stretch, so on the circle of fifths the shape is one clean arc
  {let gi=0,gw=-1;ord.forEach((x,i)=>{const nx=ord[(i+1)%ord.length],w=(pi(nx)-pi(x)+12)%12;if(w>gw){gw=w;gi=i}});ord=ord.slice(gi+1).concat(ord.slice(0,gi+1))}
  g+=`<polygon points="${ord.map(x=>P(x,R).map(f).join(",")).join(" ")}" fill="color-mix(in srgb, var(--ink) 5%, transparent)" stroke="var(--ink)" stroke-opacity=".35" stroke-width="1"/>`;
  for(let x=0;x<12;x++){const [px,py]=P(x,R),[lx,ly]=P(x,R+24),inS=m.s.includes(x),t=x===0,pr=x===rx,key=x===m.k;
    g+=`<circle cx="${f(px)}" cy="${f(py)}" r="${t?8:inS?5:2.2}" fill="${t?"var(--amber)":key?"var(--wine)":inS?"var(--ink)":"var(--line)"}"/>`;
    if(pr)g+=`<circle cx="${f(px)}" cy="${f(py)}" r="${t?13:12}" fill="none" stroke="var(--wine)" stroke-width="1.4"/>`;
    g+=`<text x="${f(lx)}" y="${f(ly+5)}" text-anchor="middle" font-size="${inS?15:11}" fill="${t?"var(--amber)":pr?"var(--wine)":inS?"var(--ink)":"var(--line)"}">${N(inS?SP[m.s.indexOf(x)]:NT[(S.key+x)%12])}</text>`}
  g+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="22" font-weight="300" fill="var(--ink)">${N(SP[0])}</text>`;
  g+=`<text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="13" fill="var(--mute)">${name}</text>`;
  $("dial").innerHTML=g;$("dial").setAttribute("aria-label",T().dial);
}

function render(){
  const L=T(),m=M[S.mode],root=(S.key-m.o+12)%12,SP=spell(S.key,m.s),RN=SP[(7-S.mode)%7],nm=L.names;
  document.documentElement.lang=S.lang;document.title=S.lang==="it"?"modi":"modi";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=L[el.dataset.t]);
  [...$("lang").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));
  opts($("keys"),NT,n=>N(n),i=>S.key=i);
  // on the circles of fifths and fourths, list the modes from brightest to darkest so each tap moves the arc one step
  const ORDER=S.view?BRIGHT:[0,1,2,3,4,5,6];
  opts($("modes"),ORDER,k=>nm[k],i=>S.mode=ORDER[i]);
  [...$("keys").children].forEach((b,i)=>b.setAttribute("aria-pressed",i===S.key));
  [...$("modes").children].forEach((b,i)=>b.setAttribute("aria-pressed",ORDER[i]===S.mode));
  opts($("view"),L.views,v=>v,i=>S.view=i);
  [...$("view").children].forEach((b,i)=>b.setAttribute("aria-pressed",i===(S.view||0)));
  $("viewHint").textContent=L.viewHint[S.view||0];$("viewHint").hidden=!S.view;
  dial(m,root,SP,nm[S.mode]);
  const maj=spellFrom(RN,root,[0,2,4,5,7,9,11]).join(""),sh=(maj.match(/♯/g)||[]).length+2*(maj.match(/𝄪/g)||[]).length,fl=(maj.match(/♭/g)||[]).length+2*(maj.match(/𝄫/g)||[]).length;
  $("sig").textContent=L.sig(sh-fl);
  const t=`${N(SP[0])} ${nm[S.mode]}`,r=`${N(RN)} ${L.major}`;
  $("big").innerHTML=S.mode===0?L.itself(t,r):L.uses(t,r,L.ord[S.mode]);
  $("deg").innerHTML=m.s.map((x,i)=>`<button data-x="${x}" class="${x===0?"tonic":x===m.k?"key":""}"><span class="d">${DEG(x,m.s)}</span><span class="n">${N(SP[i])}</span></button>`).join("");
  $("info").textContent=`${L.info[S.mode]} ${L.colour(DEG(m.k,m.s))}`;
  $("same").innerHTML=M.map((o,k)=>k===S.mode?"":`<button data-k="${(root+o.o)%12}" data-m="${k}">${N(SP[(k-S.mode+7)%7])} ${nm[k]}</button>`).join("");
  let prev=null;
  $("ladder").innerHTML=BRIGHT.map(k=>{const o=M[k],sp=spellFrom(SP[0],S.key,o.s),ns=o.s.map((x,i)=>{const lowered=prev&&!prev.includes(x)&&prev.includes(x+1);return lowered?`<em>${N(sp[i])}</em>`:N(sp[i])}).join("  ");prev=o.s;
    return `<button data-m="${k}" aria-pressed="${k===S.mode}"><span class="nm">${nm[k]}</span><span class="ns">${ns}</span></button>`}).join("");
  try{localStorage.setItem("modes",JSON.stringify(S))}catch(e){}
}
$("lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.lang=b.dataset.l;render()};
$("same").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.key=+b.dataset.k;S.mode=+b.dataset.m;render()};
$("ladder").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.mode=+b.dataset.m;render()};

// sound: a soft plucked tone, tonic in the third octave
let ac=null;
function tone(x,t,len=1.4){
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  const f=130.81*Math.pow(2,(S.key+x)/12),T0=t??ac.currentTime+0.02;
  const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();
  o.type="triangle";o2.type="sine";o.frequency.value=f;o2.frequency.value=f*2;lp.type="lowpass";lp.frequency.setValueAtTime(f*8,T0);lp.frequency.exponentialRampToValueAtTime(f*2,T0+len);
  g.gain.setValueAtTime(0,T0);g.gain.linearRampToValueAtTime(0.28,T0+0.008);g.gain.exponentialRampToValueAtTime(0.0008,T0+len);
  const g2=ac.createGain();g2.gain.value=0.25;o.connect(lp);o2.connect(g2).connect(lp);lp.connect(g).connect(ac.destination);
  o.start(T0);o2.start(T0);o.stop(T0+len+0.05);o2.stop(T0+len+0.05);
}
$("deg").onclick=async e=>{const b=e.target.closest("button");if(!b)return;tone(+b.dataset.x);if(ac.state!=="running")await ac.resume();
  b.classList.add("ring");setTimeout(()=>b.classList.remove("ring"),120)};
$("playScale").onclick=async()=>{tone(0,undefined,0.01);if(ac.state!=="running")await ac.resume();
  const m=M[S.mode],seq=[...m.s,12],t0=ac.currentTime+0.05;seq.forEach((x,i)=>tone(x,t0+i*0.32,1.1));
  const btns=[...$("deg").children];seq.forEach((x,i)=>setTimeout(()=>{const b=btns[i];if(b){b.classList.add("ring");setTimeout(()=>b.classList.remove("ring"),150)}},50+i*320))};
render();
})();
</script>
<script data-goatcounter="https://phonk.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
